<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק תנועה — זכות קדימה</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            direction: rtl;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        .emoji-top {
            font-size: 72px;
            margin-bottom: 16px;
            line-height: 1;
        }

        .card-title {
            font-size: 28px;
            font-weight: bold;
            color: #222;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .card-subtitle {
            font-size: 18px;
            color: #ff6b6b;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .card-description {
            font-size: 16px;
            color: #555;
            line-height: 1.8;
            margin-bottom: 36px;
            text-align: right;
        }

        .start-btn {
            display: inline-block;
            background: #ff6b6b;
            color: #ffffff;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
            padding: 14px 40px;
            border-radius: 50px;
            transition: background 0.2s, transform 0.15s;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .start-btn:hover {
            background: #ff4c4c;
            transform: translateY(-3px);
        }

        .start-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 540px) {
            .card {
                padding: 28px 20px;
            }

            .emoji-top {
                font-size: 56px;
            }

            .card-title {
                font-size: 22px;
            }

            .card-subtitle {
                font-size: 16px;
            }

            .card-description {
                font-size: 14px;
            }

            .start-btn {
                font-size: 18px;
                padding: 12px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji-top">🚦</div>
        <h1 class="card-title">משחק תנועה — זכות קדימה</h1>
        <p class="card-subtitle">האם תדעי מי עובר ראשון?</p>
        <p class="card-description">
            בכל שלב תופיעי צומת עם כמה רכבים.
            תפקידך לסמן מי זוכה לעבור ראשון — ואז להסיע כל רכב לנקודת היעד שלו.
            השתמשי בחוקי התנועה שלמדת!
        </p>
        <a href="index.html" class="start-btn">🚗 בואו נתחיל!</a>
    </div>
</body>
</html>
